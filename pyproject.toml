[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelworld"
version = "0.6.3"
description = "PixelWorld generation core and deterministic adventure prototype"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
]

[project.scripts]
pixelworld = "pixelworld.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "golden: full Seed-42 reference integration test",
]
